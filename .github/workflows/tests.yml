name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip pytest numpy scipy
      - name: Generated files are current
        run: python tools/build.py --check
      - name: Tests
        run: python -m pytest -q
